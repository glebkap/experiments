services:
  # PostgreSQL Database
  db:
    image: postgres:12-alpine
    container_name: support-db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/opt/support/data:ro
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support
    networks:
      - support-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: support-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8100:8000"
    networks:
      - support-network
    restart: unless-stopped

  # Parser Service
  parser:
    build: ./services/parser
    container_name: support-parser
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: support
    ports:
      - "8001:8001"
    networks:
      - support-network
    restart: unless-stopped

  # Analyzer Service
  analyzer:
    build: ./services/analyzer
    container_name: support-analyzer
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/support
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      DEVICE: cuda
      BATCH_SIZE: 128
    ports:
      - "8002:8002"
    networks:
      - support-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # API Gateway Service
  api-gateway:
    build: ./services/api-gateway
    container_name: support-api-gateway
    depends_on:
      - parser
      - analyzer
    environment:
      PARSER_URL: http://parser:8001
      ANALYZER_URL: http://analyzer:8002
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      REQUEST_TIMEOUT: 30
      HEALTH_CHECK_TIMEOUT: 5
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    networks:
      - support-network
    restart: unless-stopped

  # GUI Service (React Frontend)
  gui:
    build: ./services/gui
    container_name: support-gui
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - support-network
    restart: unless-stopped

volumes:
  pg_data:
    name: support-db-pg-data
  chromadb_data:
    name: support-chromadb-data

networks:
  support-network:
    driver: bridge
